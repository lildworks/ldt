def defaultJarExcludes = ["**/application-*.properties"]

afterEvaluate {
  def extraJarExcludes = project.findProperty('jarExcludes') ?: []
  def jarExcludes = (defaultJarExcludes + [extraJarExcludes].flatten()).collect { it.toString() }.unique()

  jar {
    exclude jarExcludes
  }

  bootJar {
    exclude jarExcludes
  }
}

def appMainClass = provider {
  (project.findProperty('mainClass') ?: "${project.group}.Application").toString()
}

bootRun {
  systemProperties = System.properties
  mainClass.set(appMainClass)
}
