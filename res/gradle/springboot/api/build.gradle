apply plugin: "java"
apply plugin: "org.springframework.boot"
apply plugin: "io.spring.dependency-management"

def defaultJarExcludes = ["**/application-*.properties"]

afterEvaluate {
  def extraJarExcludes = project.findProperty('jarExcludes') ?: []
  def jarExcludes = (defaultJarExcludes + [extraJarExcludes].flatten()).collect { it.toString() }.unique()

  jar {
    exclude jarExcludes
  }

  bootJar {
    exclude jarExcludes
  }
}

def appMainClass = provider {
  (project.findProperty('mainClass') ?: "${project.group}.Application").toString()
}

bootRun {
  systemProperties = System.properties
  mainClass.set(appMainClass)
}

task processProjectProperties {
  def outputDir = file("${buildDir}/generated-resources")
  outputs.file("${outputDir}/project.properties")
  doLast {
    outputDir.mkdirs()
    def propsFile = new File(outputDir, "project.properties")
    propsFile.text = ""
      .concat("project.name=${project.name}\n")
      .concat("project.version=${project.version}")
  }
}

processResources {
  dependsOn processProjectProperties
  from("${buildDir}/generated-resources") {
    include "project.properties"
  }
}
